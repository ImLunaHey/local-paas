name: Check
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-tests:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: nix build .#quality-tools --out-link /tmp/quality-tools
      - run: nix build .#remote-test-tools --out-link /tmp/remote-test-tools
      - run: echo /tmp/quality-tools/bin >> "$GITHUB_PATH"
      - run: echo /tmp/remote-test-tools/bin >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --doc --all-features
      - run: cargo test -p platform-remote-worker -- --ignored

  database-tests:
    name: Database tests (${{ matrix.partition }}/4)
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: platform_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_test -d platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://platform_test:local_test_only@localhost:5432/platform_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: nix build .#quality-tools --out-link /tmp/quality-tools
      - run: echo /tmp/quality-tools/bin >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: sqlx migrate run
      - run: >-
          cargo nextest run -p control-plane --tests
          --run-ignored ignored-only
          --partition hash:${{ matrix.partition }}/4

  contracts:
    name: Generated contracts
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: platform_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_test -d platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://platform_test:local_test_only@localhost:5432/platform_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: pnpm install --frozen-lockfile
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: nix build .#quality-tools --out-link /tmp/quality-tools
      - run: echo /tmp/quality-tools/bin >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: sqlx migrate run
      - run: cargo sqlx prepare --check --workspace -- --all-targets
        env:
          SQLX_OFFLINE: "false"
      - run: cargo run -p control-plane --bin export-openapi > /tmp/openapi.json
      - run: diff -u docs/api/openapi.json /tmp/openapi.json
      - run: pnpm --dir web generate:api
      - run: git diff --exit-code -- web/src/generated

  web:
    name: Web quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web check
      - run: pnpm --dir web test:coverage

  browser:
    name: Browser (${{ matrix.browser }}, ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: platform_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_test -d platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://platform_test:local_test_only@localhost:5432/platform_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: pnpm install --frozen-lockfile
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: nix build .#browser-test-tools --out-link /tmp/browser-test-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: cargo build -p control-plane --bins
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        working-directory: web
      - run: >-
          PATH="/tmp/browser-test-tools/bin:$PATH"
          bash infra/tests/browser.sh
          --project=${{ matrix.browser }}
          --shard=${{ matrix.shard }}/3
          --max-failures=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.browser }}-${{ matrix.shard }}
          path: web/test-results/
          retention-days: 7

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: nix build .#quality-tools --out-link /tmp/quality-tools
      - run: echo /tmp/quality-tools/bin >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: cargo audit
      - run: cargo deny check
      - run: pnpm audit --audit-level high
      - run: gitleaks git --redact --no-banner
