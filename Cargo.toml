[workspace]
members = ["crates/domain", "crates/runtime", "crates/build-runner", "crates/control-plane", "crates/protocol", "crates/sources", "crates/node-agent"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process", "io-util", "fs", "sync"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
