[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "0BSD", "CDLA-Permissive-2.0", "BSL-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Do not enable SQLx's optional MySQL driver (its RSA dependency has no fixed release).
deny = [{ name = "rsa" }, { name = "sqlx-mysql" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
