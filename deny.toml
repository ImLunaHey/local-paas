[graph]
all-features = true

[advisories]
version = 2
# Transitive through lucid-auth provider code that local-paas does not configure:
# - atomic-polyfill is used by phonenumber's build dependency;
# - rsa and crypto-bigint are used by dormant JWT/SAML asymmetric-key paths.
# Remove these exceptions when lucid-auth makes provider dependencies optional.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2023-0089", "RUSTSEC-2026-0387"]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "0BSD", "CDLA-Permissive-2.0", "BSL-1.0", "MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Do not enable SQLx's optional MySQL driver. lucid-auth currently compiles RSA for
# dormant JWT/SAML provider paths; the advisory exception above documents that case.
deny = [{ name = "sqlx-mysql" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/lucid-softworks/auth.git"]
