[package]
name = "control-plane"
default-run = "control-plane"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
platform-telemetry = { version = "0.1.0", path = "../telemetry" }
platform-sources = { version = "0.1.0", path = "../sources" }
tempfile = "3"
rustix = { version = "1.1", features = ["fs"] }
libc = "0.2"
base64 = "0.22"
platform-domain = { version = "0.1.0", path = "../domain" }
platform-protocol = { version = "0.1.0", path = "../protocol" }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
platform-build-runner = { version = "0.1.0", path = "../build-runner" }
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json", "chrono", "migrate", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror.workspace = true
aws-sigv4 = "1.6.3"
aws-credential-types = "1.3.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
redis = { version = "1.7.0", default-features = false, features = ["tokio-comp"] }
utoipa = { version = "5", features = ["uuid", "chrono"] }
garde = { version = "0.23", features = ["derive"] }
lucid-auth = { version = "=0.1.0", git = "https://github.com/lucid-softworks/auth.git", rev = "e213a07d4a1b810dbac95e58fe1398b67243d4d5", features = ["axum", "postgres"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
