[package]
name = "control-plane"
default-run = "control-plane"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
platform-sources = { path = "../sources" }
tempfile = "3"
libc = "0.2"
base64 = "0.22"
platform-domain = { path = "../domain" }
platform-protocol = { path = "../protocol" }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
platform-build-runner = { path = "../build-runner" }
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json", "chrono", "migrate", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aws-sigv4 = "1.6.3"
aws-credential-types = "1.3.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
redis = { version = "1.7.0", default-features = false, features = ["tokio-comp"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
